[package]
name = "chimpPOS_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "postgres",
    "derive",
    "macros",
    "uuid",
    "chrono",
    "rust_decimal",
    "tls-rustls",
    "migrate"
] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
dotenvy = "0.15.7"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
thiserror = "2"
jsonwebtoken = "9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["cors", "timeout", "trace", "catch-panic", "set-header", "request-id", "util"] }

tower = { version = "0.5", features = ["util"] }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
