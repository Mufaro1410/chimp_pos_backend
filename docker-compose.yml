# Production-style stack: PostgreSQL + API (+ Caddy for automatic HTTPS).
# 1. cp .env.production.example .env.production   and fill it in
# 2. docker compose --env-file .env.production up -d --build
# Nothing is published to the internet except Caddy (80/443).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chimp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: chimp_pos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chimp -d chimp_pos"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://chimp:${POSTGRES_PASSWORD}@db:5432/chimp_pos
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://chimp:${POSTGRES_PASSWORD}@db:5432/chimp_pos
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      TRUST_PROXY: "true"
      APP_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
