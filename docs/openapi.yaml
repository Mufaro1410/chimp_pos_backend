        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageOffset:
      in: query
      name: offset
      schema:
        type: integer
        minimum: 0
        default: 0
    FromDate:
      in: query
      name: from
      description: Inclusive UTC date
      schema:
        type: string
        format: date
    ToDate:
      in: query
      name: to
      description: Inclusive UTC date
      schema:
        type: string
        format: date
    SalesInterval:
      in: query
