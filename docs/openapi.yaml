openapi: 3.1.0
info:
  title: ChimpPOS Backend API
  version: 1.0.0
  description: Authentication and desktop administration REST contract. Keep paths, permissions, and schemas synchronized
    with `src/routes/mod.rs` and `src/models/administration.rs`.
servers:
- url: http://127.0.0.1:3000
security: []
paths:
  /api/v1/auth/register:
    post:
      summary: Register a company and its first owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/AuthError'
        '409':
          $ref: '#/components/responses/AuthError'
  /api/v1/auth/login:
    post:
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/AuthError'
  /api/v1/auth/me:
    get:
      security:
      - bearerAuth: []
      summary: Return authenticated user and company identifiers
      responses:
        '200':
          description: Identity
          content:
            application/json:
              schema:
                type: object
                required:
                - user_id
                - company_id
                properties:
                  user_id:
                    type: string
                    format: uuid
                  company_id:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/SecurityError'
  /api/v1/shop:
    get:
      security:
      - bearerAuth: []
      x-required-permission: settings.view
      summary: Get the authenticated user's shop configuration
      responses:
        '200':
          description: Shop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
    put:
      security:
      - bearerAuth: []
      x-required-permission: settings.manage
      summary: Update shop details using optimistic versioning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopUpdate'
      responses:
        '200':
          description: Updated shop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/users:
    get:
      security:
      - bearerAuth: []
      x-required-permission: users.view
      summary: List shop users (limit defaults to 50; maximum 100)
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
    post:
      security:
      - bearerAuth: []
      x-required-permission: users.manage
      summary: Create an active shop user and assign initial roles
      description: Accepts an administrator-provided temporary password. No invitation or password-reset delivery
        flow is implemented yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/users/{id}:
    parameters:
    - $ref: '#/components/parameters/UuidPath'
    get:
      security:
      - bearerAuth: []
      x-required-permission: users.view
      summary: Get a shop user without authentication secrets
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '404':
          $ref: '#/components/responses/ApiError'
    put:
      security:
      - bearerAuth: []
      x-required-permission: users.manage
      summary: Update user profile or activate/deactivate account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/users/{id}/roles:
    put:
      security:
      - bearerAuth: []
      x-required-permission: roles.manage
      summary: Replace a user's role assignments within the authenticated shop
      parameters:
      - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdate'
      responses:
        '200':
          description: Updated user and roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/roles:
    get:
      security:
      - bearerAuth: []
      x-required-permission: roles.view
      summary: List shop roles with assigned permissions
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
  /api/v1/roles/{id}:
    get:
      security:
      - bearerAuth: []
      x-required-permission: roles.view
      summary: Get a role and its permissions
      parameters:
      - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/roles/{id}/permissions:
    put:
      security:
      - bearerAuth: []
      x-required-permission: roles.manage
      summary: Replace permissions on a custom role; built-in roles are immutable
      parameters:
      - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionUpdate'
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/permissions:
    get:
      security:
      - bearerAuth: []
      x-required-permission: roles.view
      summary: List assignable permission catalogue entries
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
  /api/v1/customers/{id}/account:
    get:
      security:
      - bearerAuth: []
      x-required-permission: customers.view
      summary: Get derived customer receivable balance in company base currency
      parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      responses:
        '200':
          description: Account balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/customers/{id}/statement:
    get:
      security:
      - bearerAuth: []
      x-required-permission: customers.view
      summary: Get paginated customer account activity with running balance
      parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Statement page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementPage'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
  /api/v1/customers/{id}/outstanding-sales:
    get:
      security:
      - bearerAuth: []
      x-required-permission: customers.view
      summary: List outstanding completed customer sales
      parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Outstanding sale page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutstandingPage'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
  /api/v1/customers/{id}/payments:
    post:
      security:
      - bearerAuth: []
      x-required-permission: customers.payment
      summary: Post customer receipt and optional multi-sale allocations atomically
      parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      responses:
        '201':
          description: Posted receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingResult'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '400':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/customers/{id}/credit-notes:
    post:
      security:
      - bearerAuth: []
      x-required-permission: customers.credit
      summary: Post customer credit note against receivable (optionally linked to a sale)
      parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditNoteCreate'
      responses:
        '201':
          description: Posted credit note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingResult'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '400':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/suppliers/{id}/account:
    get:
      security:
      - bearerAuth: []
      x-required-permission: suppliers.view
      summary: Get derived supplier payable balance in base currency
      parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      responses:
        '200':
          description: Account balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/suppliers/{id}/statement:
    get:
      security:
      - bearerAuth: []
      x-required-permission: suppliers.view
      summary: Get paginated supplier account activity with running balance
      parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Statement page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementPage'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/suppliers/{id}/outstanding-invoices:
    get:
      security:
      - bearerAuth: []
      x-required-permission: suppliers.view
      summary: List outstanding posted supplier invoices
      parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Outstanding invoice page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutstandingPage'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/suppliers/{id}/invoices:
    get:
      security:
      - bearerAuth: []
      x-required-permission: suppliers.view
      summary: List supplier invoices
      parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Invoice page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePage'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
    post:
      security:
      - bearerAuth: []
      x-required-permission: suppliers.invoice
      summary: Create and post a supplier invoice atomically
      description: Invoices are base currency only until supplier payment currency is persisted by a reviewed migration.
        A purchase order or receipt does not create the payable.
      parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceCreate'
      responses:
        '201':
          description: Posted supplier invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierInvoice'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '400':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/supplier-invoices/{id}:
    get:
      security:
      - bearerAuth: []
      x-required-permission: suppliers.view
      summary: Get supplier invoice and line snapshots
      parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      responses:
        '200':
          description: Invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierInvoice'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/suppliers/{id}/payments:
    post:
      security:
      - bearerAuth: []
      x-required-permission: suppliers.payment
      summary: Post supplier payment and optional multi-invoice allocations atomically
      parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      responses:
        '201':
          description: Posted supplier payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingResult'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '400':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/suppliers/{id}/credit-notes:
    post:
      security:
      - bearerAuth: []
      x-required-permission: suppliers.invoice
      summary: Post supplier credit note against a posted invoice
      parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditNoteCreate'
      responses:
        '201':
          description: Posted credit note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingResult'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
        '400':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/reports/dashboard:
    get:
      security:
      - bearerAuth: []
      x-required-permission: reports.view
      summary: Company dashboard totals and recent activity
      parameters:
      - $ref: '#/components/parameters/LowStockThreshold'
      responses:
        '200':
          description: Report result; monetary values are decimal strings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportObject'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
  /api/v1/reports/sales/summary:
    get:
      security:
      - bearerAuth: []
      x-required-permission: reports.view
      summary: Gross and net sales with daily, weekly or monthly breakdown
      parameters:
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      - $ref: '#/components/parameters/SalesInterval'
      responses:
        '200':
          description: Report result; monetary values are decimal strings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportObject'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
  /api/v1/reports/sales/by-product:
    get:
      security:
      - bearerAuth: []
      x-required-permission: reports.view
      summary: Sales grouped by sale-line variant
      parameters:
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Report result; monetary values are decimal strings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPage'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
  /api/v1/reports/sales/by-category:
    get:
      security:
      - bearerAuth: []
      x-required-permission: reports.view
      summary: Sales grouped by current product category
      parameters:
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Report result; monetary values are decimal strings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPage'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
  /api/v1/reports/sales/by-payment-method:
    get:
      security:
      - bearerAuth: []
      x-required-permission: reports.view
      summary: Checkout payments grouped by method
      parameters:
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Report result; monetary values are decimal strings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportObject'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
  /api/v1/reports/sales/transactions:
    get:
      security:
      - bearerAuth: []
      x-required-permission: reports.view
      summary: Paginated sale history with status, location and payment filters
      parameters:
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/PageOffset'
      - $ref: '#/components/parameters/SaleStatus'
      - $ref: '#/components/parameters/LocationId'
      - $ref: '#/components/parameters/PaymentMethod'
      responses:
        '200':
          description: Report result; monetary values are decimal strings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPage'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
  /api/v1/reports/sales/returns:
    get:
      security:
      - bearerAuth: []
      x-required-permission: reports.view
      summary: Return, refund and void event totals
      parameters:
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Report result; monetary values are decimal strings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportObject'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
  /api/v1/reports/sales/gross-profit:
    get:
      security:
      - bearerAuth: []
      x-required-permission: reports.view
      summary: Gross profit availability; historical cost is not stored on sale lines
      parameters:
      - $ref: '#/components/parameters/FromDate'
      - $ref: '#/components/parameters/ToDate'
      responses:
        '501':
          description: Not available because historical sale cost is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/SecurityError'
        '403':
          $ref: '#/components/responses/SecurityError'
  /api/v1/reports/inventory/stock:
    get:
      security:
      - bearerAuth: []
      x-required-permission: reports.view
